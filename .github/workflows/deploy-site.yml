name: Deploy to GitHub Pages # The name of this workflow

on:
  push:
    branches: [main]
  workflow_dispatch: # TODO: Why do we need this?

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3 #Existing action
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: # Has two fixed keys - name and url
      name: github-pages
      # url: ${{ steps.deployment.outputs.page_url }} # Evaluated when all the jobs finish
    steps:
      - # id: deployment
        uses: actions/deploy-pages@v4 #Existing action
